name: Testes de unidade

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testes xUnit
        run: dotnet test CalculadoraImc.Tests.XUnit --logger "console;verbosity=normal" --logger "trx;LogFileName=xunit.trx" --results-directory TestResults

      - name: Testes MSTest
        run: dotnet test CalculadoraImc.Tests.MSTest --logger "console;verbosity=normal" --logger "trx;LogFileName=mstest.trx" --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: TestResults/*.trx
